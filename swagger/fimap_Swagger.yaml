      responses:
        '200':
          description: Lista de cartões
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cartao'
        '401':
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
 








components:
  securitySchemes:
    autenticacaoBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token JWT obtido em /autenticacao/entrar ou renovado em /autenticacao/renovar-token

  parameters:
    Pagina:
      name: pagina
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    TamanhoPagina:
      name: tamanho_pagina
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    SessaoId:
      name: sessaoId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConexaoId:
      name: conexaoId
      in: path
      required: true
      description: ID interno do FIMAP para a conexão (não é o ID do provedor externo)
      schema: { type: string, format: uuid }
    ConexaoIdQuery:
      name: conexao_id
      in: query
      description: >
        Filtra por uma conexão Open Finance específica (ID interno do
        FIMAP em conexoes_open_finance). Quando omitido, consulta todas
        as conexões ativas do usuário.
      schema: { type: string, format: uuid }
    MetaId:
      name: metaId
      in: path
      required: true
      schema: { type: string, format: uuid }
    NotificacaoId:
      name: notificacaoId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PublicacaoId:
      name: publicacaoId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ComentarioId:
      name: comentarioId
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    Erro:
      type: object
      required: [codigo, mensagem]
      properties:
        codigo:
          type: string
        mensagem:
          type: string
        detalhes:
          type: array
          description: Detalhes de validação por campo (usado em 400/422)
          items:
            type: object
            properties:
              campo:
                type: string
              mensagem:
                type: string

    # ---------- Autenticação ----------
    RequisicaoCadastro:
      type: object
      required: [nome, email, senha]
      properties:
        nome:
          type: string
        email:
          type: string
          format: email
        nome_usuario:
          type: string
        senha:
          type: string
          format: password
          description: Nunca retornado; armazenado como senha_hash no back-end

    RequisicaoLogin:
      type: object
      required: [email, senha]
      properties:
        email:
          type: string
          format: email
        senha:
          type: string
          format: password

    TokensAutenticacao:
      type: object
      required: [token_acesso, token_renovacao, expira_em]
      properties:
        token_acesso:
          type: string
        token_renovacao:
          type: string
        expira_em:
          type: integer
          description: Validade do token de acesso, em segundos

    RespostaLogin:
      type: object
      required: [requer_segundo_fator]
      properties:
        requer_segundo_fator:
          type: boolean
          description: Quando true, `tokens` e `usuario` vêm nulos/ausentes.
        tokens:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/TokensAutenticacao'
        usuario:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Usuario'

    Usuario:
      type: object
      description: DTO público — nunca inclui senha_hash.
      required: [id, nome, email, status]
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        email:
          type: string
          format: email
        nome_usuario:
          type: string
        data_criacao:
          type: string
          format: date-time
        status:
          type: string
          enum: [ativo, inativo, bloqueado]

    EntradaPerfil:
      type: object
      minProperties: 1
      properties:
        nome:
          type: string
        nome_usuario:
          type: string

    Sessao:
      type: object
      required: [id, criado_em, expira_em, atual]
      properties:
        id:
          type: string
          format: uuid
        dispositivo:
          type: string
        criado_em:
          type: string
          format: date-time
        expira_em:
          type: string
          format: date-time
        atual:
          type: boolean
          description: Indica se é a sessão da requisição corrente

    RespostaConfiguracaoSegundoFator:
      type: object
      description: Segredo exibido apenas no momento do provisionamento; não é recuperável depois.
      required: [segredo, url_otpauth, qr_code_base64]
      properties:
        segredo:
          type: string
          description: Segredo de enrolamento (exibido uma única vez)
        url_otpauth:
          type: string
        qr_code_base64:
          type: string

    # ---------- Preferências ----------
    PreferenciasUsuario:
      type: object
      properties:
        usuario_id:
          type: string
          format: uuid
        notificacoes:
          type: object
          additionalProperties: true
        privacidade:
          type: object
          additionalProperties: true
        preferencias_ia:
          type: object
          additionalProperties: true

    EntradaPreferenciasUsuario:
      type: object
      properties:
        notificacoes:
          type: object
          additionalProperties: true
        privacidade:
          type: object
          additionalProperties: true
        preferencias_ia:
          type: object
          additionalProperties: true

    # ---------- Open Finance (metadados) ----------
    ConexaoOpenFinance:
      type: object
      description: Somente metadados técnicos da conexão/consentimento — nunca saldo ou transações.
      required: [id, instituicao_id_externo, status]
      properties:
        id:
          type: string
          format: uuid
          description: ID interno do FIMAP
        instituicao_nome:
          type: string
        instituicao_id_externo:
          type: string
          description: Identificador da instituição no provedor de Open Finance
        status:
          type: string
          enum: [pendente, autorizada, revogada, expirada, erro]
        escopos:
          type: array
          items:
            type: string
        url_autorizacao:
          type: string
          format: uri
          nullable: true
          description: URL para o usuário concluir o consentimento (presente quando status = pendente)
        criado_em:
          type: string
          format: date-time
        atualizado_em:
          type: string
          format: date-time

    EntradaConexaoOpenFinance:
      type: object
      required: [instituicao_id_externo]
      properties:
        instituicao_id_externo:
          type: string
        escopos:
          type: array
          items:
            type: string

    # ---------- Dados Financeiros (DTOs externos, não persistidos) ----------
    ResumoFinanceiro:
      type: object
      description: Agregado calculado em tempo real — não corresponde a tabela local.
      properties:
        saldo_total:
          type: number
          format: double
        receitas_periodo:
          type: number
          format: double
        despesas_periodo:
          type: number
          format: double
        atualizado_em:
          type: string
          format: date-time

    ContaFinanceira:
      type: object
      description: Dado externo consultado sob demanda — sem tabela local.
      properties:
        id_externo:
          type: string
          description: ID da conta no provedor de Open Finance
        conexao_id:
          type: string
          format: uuid
          description: ID interno da conexão FIMAP correspondente
        instituicao_nome:
          type: string
        tipo:
          type: string
        nome:
          type: string
        saldo:
          type: number
          format: double

    TransacaoFinanceira:
      type: object
      description: Dado externo consultado sob demanda — sem tabela local.
      properties:
        id_externo:
          type: string
        conexao_id:
          type: string
          format: uuid
          description: ID interno da conexão FIMAP correspondente
        conta_id_externo:
          type: string
        tipo:
          type: string
          enum: [receita, despesa]
        valor:
          type: number
          format: double
        data:
          type: string
          format: date
        descricao:
          type: string
        categoria:
          type: string

    InvestimentoFinanceiro:
      type: object
      description: Dado externo consultado sob demanda — sem tabela local.
      properties:
        id_externo:
          type: string
        conexao_id:
          type: string
          format: uuid
          description: ID interno da conexão FIMAP correspondente
        ativo_codigo:
          type: string
        quantidade:
          type: number
          format: double
        valor_atual:
          type: number
          format: double

    AtivoFinanceiro:
      type: object
      description: Dado externo consultado sob demanda — sem tabela local.
      properties:
        codigo:
          type: string
        nome:
          type: string
        tipo:
          type: string
        mercado:
          type: string

    CartaoFinanceiro:
      type: object
      description: Dado externo consultado sob demanda — sem tabela local.
      properties:
        id_externo:
          type: string
        conexao_id:
          type: string
          format: uuid
          description: ID interno da conexão FIMAP correspondente
        nome:
          type: string
        final_cartao:
          type: string
        limite:
          type: number
          format: double

    FaturaFinanceira:
      type: object
      description: Dado externo consultado sob demanda — sem tabela local.
      properties:
        id_externo:
          type: string
        cartao_id_externo:
          type: string
        periodo:
          type: string
        valor_total:
          type: number
          format: double
        status:
          type: string

    # ---------- Cartões (GET /cartoes) ----------
    Cartao:
      type: object
      description: Cartão do usuário autenticado, listado em GET /cartoes.
      required: [id, nome, tipo, ativo]
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        tipo:
          type: string
          enum: [credito, debito]
        bandeira:
          type: string
          nullable: true
        final_cartao:
          type: string
          description: Últimos dígitos do cartão
          example: "1234"
        limite:
          type: number
          format: double
          nullable: true
          description: Limite do cartão; nulo para cartões de débito
        ativo:
          type: boolean
        conexao_id:
          type: string
          format: uuid
          nullable: true
          description: ID interno da conexão FIMAP de origem, quando o cartão vem do Open Finance
        criado_em:
          type: string
          format: date-time
        atualizado_em:
          type: string
          format: date-time

    # ---------- Metas ----------
    MetaFinanceira:
      type: object
      required: [id, nome, valor_alvo, valor_atual, status]
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        valor_alvo:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
        valor_atual:
          type: number
          format: double
          minimum: 0
        prazo:
          type: string
          format: date
          nullable: true
        status:
          type: string
          enum: [em_andamento, concluida, atrasada, cancelada]
        percentual_progresso:
          type: number
          format: float
          readOnly: true
          description: Calculado pelo Back-end (valor_atual / valor_alvo)

    EntradaMetaFinanceira:
      type: object
      required: [nome, valor_alvo]
      properties:
        nome:
          type: string
        valor_alvo:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
        valor_atual:
          type: number
          format: double
          minimum: 0
          default: 0
        prazo:
          type: string
          format: date

    AtualizacaoMetaFinanceira:
      type: object
      minProperties: 1
      properties:
        nome:
          type: string
        valor_alvo:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
        valor_atual:
          type: number
          format: double
          minimum: 0
        prazo:
          type: string
          format: date
        status:
          type: string
          enum: [em_andamento, concluida, atrasada, cancelada]

    # ---------- Notificações ----------
    Notificacao:
      type: object
      required: [id, titulo, mensagem, lida, criada_em]
      properties:
        id:
          type: string
          format: uuid
        tipo:
          type: string
        titulo:
          type: string
        mensagem:
          type: string
        lida:
          type: boolean
          description: Estado de leitura (usado no filtro `lida` e no PATCH)
        lida_em:
          type: string
          format: date-time
          nullable: true
        criada_em:
          type: string
          format: date-time

    # ---------- Comunidade ----------
    Publicacao:
      type: object
      required: [id, usuario_id, texto, criada_em, status]
      properties:
        id:
          type: string
          format: uuid
        usuario_id:
          type: string
          format: uuid
        texto:
          type: string
        total_curtidas:
          type: integer
        total_comentarios:
          type: integer
        curtida_pelo_usuario:
          type: boolean
          description: Indica se o usuário autenticado já curtiu (evita 409 em POST /curtidas)
        criada_em:
          type: string
          format: date-time
        status:
          type: string
          enum: [publicada, removida, moderada]

    EntradaPublicacao:
      type: object
      required: [texto]
      properties:
        texto:
          type: string
          minLength: 1

    Comentario:
      type: object
      required: [id, publicacao_id, usuario_id, texto, criada_em, status]
      properties:
        id:
          type: string
          format: uuid
        publicacao_id:
          type: string
          format: uuid
        usuario_id:
          type: string
          format: uuid
        texto:
          type: string
        criada_em:
          type: string
          format: date-time
        status:
          type: string
          enum: [publicado, removido, moderado]

    EntradaComentario:
      type: object
      required: [texto]
      properties:
        texto:
          type: string
          minLength: 1

    # ---------- Conquistas / Badges (opcional) ----------
    Conquista:
      type: object
      description: OPCIONAL — expor somente se gamificação estiver no escopo final.
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        descricao:
          type: string
        icone_url:
          type: string

    ConquistaUsuario:
      type: object
      description: OPCIONAL — expor somente se gamificação estiver no escopo final.
      properties:
        conquista_id:
          type: string
          format: uuid
        conquista:
          $ref: '#/components/schemas/Conquista'
        obtida_em:
          type: string
          format: date-time

    # ---------- IA ----------
    Conversa:
      type: object
      description: Conversa do usuário com o assistente financeiro.
      required: [id, criado_em, atualizado_em]
      properties:
        id:
          type: string
          format: uuid
        titulo:
          type: string
          nullable: true
          maxLength: 120
          description: Informado pelo usuário ou gerado a partir da primeira mensagem
        descricao:
          type: string
          nullable: true
        criado_em:
          type: string
          format: date-time
        atualizado_em:
          type: string
          format: date-time
          description: Usado para ordenar a listagem (mais recente primeiro)

    MensagemIA:
      type: object
      required: [id, conversa_id, papel, conteudo, criada_em]
      properties:
        id:
          type: string
          format: uuid
        conversa_id:
          type: string
          format: uuid
        papel:
          type: string
          enum: [usuario, assistente]
        conteudo:
          type: string
        criada_em:
          type: string
          format: date-time

    ListaMensagens:
      type: object
      description: >
        Página de mensagens com paginação por cursor. Mensagens ordenadas da
        mais antiga para a mais recente dentro da página.
      required: [mensagens, tem_mais]
      properties:
        mensagens:
          type: array
          items:
            $ref: '#/components/schemas/MensagemIA'
        proximo_cursor:
          type: string
          format: uuid
          nullable: true
          description: Enviar como `antes_de` para carregar as mensagens mais antigas. Nulo quando não há mais páginas.
        tem_mais:
          type: boolean
          description: Indica se existem mensagens anteriores a esta página

    RespostaEnvioMensagem:
      type: object
      required: [mensagem_usuario, mensagem_assistente]
      properties:
        mensagem_usuario:
          $ref: '#/components/schemas/MensagemIA'
        mensagem_assistente:
          $ref: '#/components/schemas/MensagemIA'

    RecomendacaoIA:
      type: object
      description: Histórico persistido em recomendacoes_ia.
      properties:
        id:
          type: string
          format: uuid
        contexto:
          type: string
        recomendacao:
          type: string
        criada_em:
          type: string
          format: date-time

