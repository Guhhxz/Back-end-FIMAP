      responses:
        '200':
          description: Posição do usuário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ranking'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          description: Usuário ainda não ranqueado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /ia/chats:
    post:
      operationId: criarChat
      tags:
      - IA
      summary: Criar novo chat com o assistente financeiro (tbl_chat)
      description: Cria o chat e vincula o usuário autenticado em tbl_usuario_chat. Se `nome` não for informado,
        o Back-end gera um a partir da primeira mensagem.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                nome:
                  type: string
                  maxLength: 45
                  nullable: true
      responses:
        '201':
          description: Chat criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
    get:
      operationId: listarChats
      tags:
      - IA
      summary: Listar chats do usuário
      description: Chats em que o usuário é participante (tbl_usuario_chat), do mais recente para o mais antigo
        (última mensagem).
      parameters:
      - $ref: '#/components/parameters/Pagina'
      - $ref: '#/components/parameters/TamanhoPagina'
      responses:
        '200':
          description: Lista de chats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Chat'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
  /ia/chats/{chatId}:
    parameters:
    - $ref: '#/components/parameters/ChatId'
    get:
      operationId: consultarChat
      tags:
      - IA
      summary: Consultar os dados de um chat
      responses:
        '200':
          description: Detalhe do chat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          description: Chat não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
    patch:
      operationId: renomearChat
      tags:
      - IA
      summary: Renomear um chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - nome
              properties:
                nome:
                  type: string
                  maxLength: 45
      responses:
        '200':
          description: Chat atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          description: Chat não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
    delete:
      operationId: deletarChat
      tags:
      - IA
      summary: Excluir chat e suas mensagens
      responses:
        '204':
          description: Chat excluído
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          description: Chat não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /ia/chats/{chatId}/mensagens:
    parameters:
    - $ref: '#/components/parameters/ChatId'
    get:
      operationId: listarMensagensChat
      tags:
      - IA
      summary: Listar mensagens de um chat (tbl_mensagem)
      description: Paginação por cursor. Sem `antes_de`, retorna as mais recentes; para carregar as mais antigas,
        envie `proximo_cursor` como `antes_de`. Dentro da página, da mais antiga para a mais recente.
      parameters:
      - name: antes_de
        in: query
        required: false
        description: Retorna apenas mensagens anteriores à mensagem com este id
        schema:
          type: integer
          format: int32
      - name: limite
        in: query
        required: false
        description: Quantidade máxima de mensagens por página
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 30
      responses:
        '200':
          description: Página de mensagens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaMensagens'
        '400':
          description: Parâmetros inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          description: Chat não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
    post:
      operationId: enviarMensagemChat
      tags:
      - IA
      summary: Enviar mensagem ao assistente
      description: Persiste a mensagem do usuário e a resposta do assistente em tbl_mensagem. A IA é apenas informativa/orientativa
        e não executa operações financeiras.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - conteudo
              properties:
                conteudo:
                  type: string
                  maxLength: 4000
                  minLength: 1
      responses:
        '200':
          description: Mensagem do usuário salva e resposta do assistente gerada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaEnvioMensagem'
        '400':
          description: Mensagem inválida (vazia ou acima do limite)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          description: Chat não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '429':
          description: Limite de uso excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '502':
          description: Falha no provedor de IA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '503':
          description: Serviço de IA temporariamente indisponível
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /ia/recomendacoes/categorias:
    get:
      operationId: listarCategoriasRecomendacao
      tags:
      - IA
      summary: Listar categorias de recomendação (tbl_categoria_recomendacao)
      responses:
        '200':
          description: Lista de categorias
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoriaRecomendacao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
  /ia/recomendacoes:
    get:
      operationId: listarRecomendacoesIA
      tags:
      - IA
      summary: Listar recomendações geradas para o usuário (tbl_recomendacao_ia)
      parameters:
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/StatusRecomendacao'
      - name: categoria_id
        in: query
        schema:
          type: integer
          format: int32
      - $ref: '#/components/parameters/Pagina'
      - $ref: '#/components/parameters/TamanhoPagina'
      responses:
        '200':
          description: Lista de recomendações
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecomendacaoIA'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
  /ia/recomendacoes/{recomendacaoId}:
    parameters:
    - $ref: '#/components/parameters/RecomendacaoId'
    patch:
      operationId: atualizarStatusRecomendacao
      tags:
      - IA
      summary: Atualizar o status de uma recomendação (aceitar/descartar)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              properties:
                status:
                  $ref: '#/components/schemas/StatusRecomendacao'
      responses:
        '200':
          description: Recomendação atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecomendacaoIA'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          description: Recomendação não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '422':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
components:
  securitySchemes:
    autenticacaoBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token JWT obtido em /autenticacao/entrar ou renovado em /autenticacao/renovar-token
  responses:
    NaoAutenticado:
      description: Não autenticado (token ausente, inválido ou expirado)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
  parameters:
    Pagina:
      name: pagina
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    TamanhoPagina:
      name: tamanho_pagina
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    DispositivoId:
      name: dispositivoId
      in: path
      required: true
      schema:
        type: integer
        format: int32
    UsuarioId:
      name: usuarioId
      in: path
      required: true
      schema:
        type: integer
        format: int32
    ConexaoId:
      name: conexaoId
      in: path
      required: true
      schema:
        type: integer
        format: int32
      description: ID interno do FIMAP (tbl_conexao_open_finance.id), não o ID do provedor externo
    ConexaoIdQuery:
      name: conexao_id
      in: query
      description: Filtra por uma conexão Open Finance (tbl_conexao_open_finance.id). Quando omitido, consulta todas
        as conexões ativas do usuário.
      schema:
        type: integer
        format: int32
    MetaId:
      name: metaId
      in: path
      required: true
      schema:
        type: integer
        format: int32
    SimulacaoId:
      name: simulacaoId
      in: path
      required: true
      schema:
        type: integer
        format: int32
    NotificacaoId:
      name: notificacaoId
      in: path
      required: true
      schema:
        type: integer
        format: int32
    PostId:
      name: postId
      in: path
      required: true
      schema:
        type: integer
        format: int32
    ComentarioId:
      name: comentarioId
      in: path
      required: true
      schema:
        type: integer
        format: int32
    ChatId:
      name: chatId
      in: path
      required: true
      schema:
        type: integer
        format: int32
    RecomendacaoId:
      name: recomendacaoId
      in: path
      required: true
      schema:
        type: integer
        format: int32
  schemas:
    Erro:
      type: object
      required:
      - codigo
      - mensagem
      properties:
        codigo:
          type: string
        mensagem:
          type: string
        detalhes:
          type: array
          description: Detalhes de validação por campo (400/422)
          items:
            type: object
            properties:
              campo:
                type: string
              mensagem:
                type: string
    RequisicaoCadastro:
      type: object
      required:
      - nome
      - cpf
      - email
      - username
      - senha
      properties:
        nome:
          type: string
          maxLength: 80
        cpf:
          type: string
          maxLength: 20
        email:
          type: string
          maxLength: 255
          format: email
        username:
          type: string
          maxLength: 80
        senha:
          type: string
          maxLength: 255
          format: password
          description: Nunca retornada; armazenada como hash em tbl_usuario.senha
    DispositivoEntrada:
      type: object
      required:
      - nome
      - sistema_operacional
      - mac
      properties:
        nome:
          type: string
          maxLength: 67
        sistema_operacional:
          type: string
          maxLength: 24
        mac:
          type: string
          maxLength: 20
    RequisicaoLogin:
      type: object
      required:
      - email
      - senha
      properties:
        email:
          type: string
          maxLength: 255
          format: email
        senha:
          type: string
          format: password
        dispositivo:
          $ref: '#/components/schemas/DispositivoEntrada'
    TokensAutenticacao:
      type: object
      required:
      - token_acesso
      - token_renovacao
      - expira_em
      properties:
        token_acesso:
          type: string
        token_renovacao:
          type: string
        expira_em:
          type: integer
          description: Validade do token de acesso, em segundos
    RespostaLogin:
      type: object
      required:
      - tokens
      - usuario
      properties:
        tokens:
          $ref: '#/components/schemas/TokensAutenticacao'
        usuario:
          $ref: '#/components/schemas/Usuario'
    Visibilidade:
      type: string
      enum:
      - publico
      - privado
      description: Mapeia tbl_usuario.visibilidade (TINYINT). Valores numéricos a confirmar.
    Usuario:
      type: object
      description: DTO do próprio usuário (tbl_usuario). Nunca inclui `senha`.
      required:
      - id
      - nome
      - cpf
      - email
      - username
      - xp_usuario
      - nivel_total
      properties:
        id:
          type: integer
          format: int32
        nome:
          type: string
          maxLength: 80
        cpf:
          type: string
          maxLength: 20
        email:
          type: string
          maxLength: 255
          format: email
        username:
          type: string
          maxLength: 80
        xp_usuario:
          type: integer
          format: int32
        nivel_total:
          type: integer
          format: int32
        foto_perfil:
          type: string
          maxLength: 255
          nullable: true
        nome_exibicao:
          type: string
          maxLength: 80
          nullable: true
        username_social:
          type: string
          maxLength: 80
          nullable: true
        biografia_social:
          type: string
          maxLength: 250
          nullable: true
        localizacao_estado:
          type: string
          maxLength: 100
          nullable: true
        visibilidade:
          $ref: '#/components/schemas/Visibilidade'
    EntradaPerfil:
      type: object
      properties:
        nome:
          type: string
          maxLength: 80
        username:
          type: string
          maxLength: 80
        foto_perfil:
          type: string
          maxLength: 255
          nullable: true
        nome_exibicao:
          type: string
          maxLength: 80
          nullable: true
        username_social:
          type: string
          maxLength: 80
          nullable: true
        biografia_social:
          type: string
          maxLength: 250
          nullable: true
        localizacao_estado:
          type: string
          maxLength: 100
          nullable: true
        visibilidade:
          $ref: '#/components/schemas/Visibilidade'
      minProperties: 1
    UsuarioResumo:
      type: object
      description: Identificação social mínima (autor de post/comentário, ranking, seguidores).
      required:
      - id
      properties:
        id:
          type: integer
          format: int32
        nome_exibicao:
          type: string
          maxLength: 80
          nullable: true
        username_social:
          type: string
          maxLength: 80
          nullable: true
        foto_perfil:
          type: string
          maxLength: 255
          nullable: true
    PerfilPublico:
      type: object
      required:
      - id
      properties:
        id:
          type: integer
          format: int32
        nome_exibicao:
          type: string
          maxLength: 80
          nullable: true
        username_social:
          type: string
          maxLength: 80
          nullable: true
        foto_perfil:
          type: string
          maxLength: 255
          nullable: true
        biografia_social:
          type: string
          maxLength: 250
          nullable: true
        localizacao_estado:
          type: string
          maxLength: 100
          nullable: true
        xp_usuario:
          type: integer
          format: int32
        nivel_total:
          type: integer
          format: int32
        total_seguidores:
          type: integer
          format: int32
        total_seguindo:
          type: integer
          format: int32
        seguido_pelo_usuario:
          type: boolean
          description: Se o usuário autenticado já segue este perfil
    Dispositivo:
      type: object
      required:
      - id
      - nome
      - sistema_operacional
      - data_cadastro
      properties:
        id:
          type: integer
          format: int32
        nome:
          type: string
          maxLength: 67
        sistema_operacional:
          type: string
          maxLength: 24
        mac:
          type: string
          maxLength: 20
        data_cadastro:
          type: string
          format: date-time
        atual:
          type: boolean
          description: Indica se é o dispositivo da requisição corrente
    Configuracoes:
      type: object
      description: Espelha tbl_configuracoes (campos TINYINT tratados como booleanos).
      required:
      - notificacao
      - alerta
      - relatorio
      - recomendacao
      - topicos
      properties:
        notificacao:
          type: boolean
        alerta:
          type: boolean
        relatorio:
          type: boolean
        recomendacao:
          type: boolean
        topicos:
          type: boolean
    ConexaoOpenFinance:
      type: object
      description: Somente metadados técnicos. `consentimento_api` (identificador do consentimento) é segredo do
        Back-end e não é exposto.
      required:
      - id
      - status
      properties:
        id:
          type: integer
          format: int32
        status:
          type: string
          enum:
          - pendente
          - autorizada
          - revogada
          - expirada
          - erro
          description: Mapeia tbl_conexao_open_finance.status (TINYINT). Códigos numéricos a confirmar.
        ultima_sincronizacao:
          type: string
          format: date-time
          nullable: true
        url_autorizacao:
          type: string
          format: uri
          nullable: true
          description: 'Transitório: devolvido apenas na criação (status pendente); não persistido.'
    EntradaConexaoOpenFinance:
      type: object
      required:
      - instituicao_id_externo
      properties:
        instituicao_id_externo:
          type: string
          description: Instituição no provedor. Usada para iniciar o consentimento; hoje não existe coluna para
            persisti-la.
    ResumoFinanceiro:
      type: object
      description: Agregado em tempo real — não corresponde a tabela local.
      properties:
        saldo_total:
          type: number
          format: double
        receitas_periodo:
          type: number
          format: double
        despesas_periodo:
          type: number
          format: double
        atualizado_em:
          type: string
          format: date-time
    ContaFinanceira:
      type: object
      description: Dado externo consultado sob demanda — sem tabela local.
      properties:
        id_externo:
          type: string
        conexao_id:
          type: integer
          format: int32
          description: ID interno da conexão FIMAP correspondente
        instituicao_nome:
          type: string
        tipo:
          type: string
        nome:
          type: string
        saldo:
          type: number
          format: double
    TransacaoFinanceira:
      type: object
      description: Dado externo consultado sob demanda — sem tabela local.
      properties:
        id_externo:
          type: string
        conexao_id:
          type: integer
          format: int32
          description: ID interno da conexão FIMAP correspondente
        conta_id_externo:
          type: string
        tipo:
          type: string
          enum:
          - receita
          - despesa
        valor:
          type: number
          format: double
        data:
          type: string
          format: date
        descricao:
          type: string
        categoria:
          type: string
    InvestimentoFinanceiro:
      type: object
      description: Dado externo consultado sob demanda — sem tabela local.
      properties:
        id_externo:
          type: string
        conexao_id:
          type: integer
          format: int32
          description: ID interno da conexão FIMAP correspondente
        ativo_codigo:
          type: string
        quantidade:
          type: number
          format: double
        valor_atual:
          type: number
          format: double
    AtivoFinanceiro:
      type: object
      description: Dado externo consultado sob demanda — sem tabela local.
      properties:
        codigo:
          type: string
        nome:
          type: string
        tipo:
          type: string
        mercado:
          type: string
    CartaoFinanceiro:
      type: object
      description: Dado externo consultado sob demanda — sem tabela local.
      properties:
        id_externo:
          type: string
        conexao_id:
          type: integer
          format: int32
          description: ID interno da conexão FIMAP correspondente
        nome:
          type: string
        final_cartao:
          type: string
        limite:
          type: number
          format: double
    FaturaFinanceira:
      type: object
      description: Dado externo consultado sob demanda — sem tabela local.
      properties:
        id_externo:
          type: string
        conexao_id:
          type: integer
          format: int32
          description: ID interno da conexão FIMAP correspondente
        cartao_id_externo:
          type: string
        periodo:
          type: string
        valor_total:
          type: number
          format: double
        status:
          type: string
    StatusMeta:
      type: string
      enum:
      - em_andamento
      - concluida
      - atrasada
      - cancelada
      description: Mapeia tbl_meta_financeira.status (TINYINT). Códigos numéricos a confirmar.
    CategoriaMeta:
      type: object
      required:
      - id
      - nome
      properties:
        id:
          type: integer
          format: int32
        nome:
          type: string
          maxLength: 80
    EntradaMetaFinanceira:
      type: object
      required:
      - nome
      - valor_desejado
      - categoria_id
      properties:
        nome:
          type: string
          maxLength: 100
        descricao:
          type: string
          nullable: true
        valor_inicio:
          type: number
          format: double
          minimum: 0
          default: 0
          description: Valor de partida da meta
        valor_desejado:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
          description: Valor-alvo a atingir
        valor_total:
          type: number
          format: double
          minimum: 0
          default: 0
          description: Valor acumulado até o momento
        data_alvo:
          type: string
          format: date-time
          nullable: true
        categoria_id:
          type: integer
          format: int32
        status:
          $ref: '#/components/schemas/StatusMeta'
    AtualizacaoMetaFinanceira:
      type: object
      properties:
        nome:
          type: string
          maxLength: 100
        descricao:
          type: string
          nullable: true
        valor_inicio:
          type: number
          format: double
          minimum: 0
          default: 0
          description: Valor de partida da meta
        valor_desejado:
          type: number
