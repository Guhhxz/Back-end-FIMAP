openapi: 3.0.3
info:
  title: FIMAP API
  description: 'API do FIMAP — plataforma de gestão e organização financeira pessoal. Alinhada ao Modelo Lógico
    (tabelas tbl_*): o FIMAP persiste apenas dados próprios do aplicativo (usuário, dispositivos, OTP, configurações,
    metadados de conexão Open Finance, metas, simulações, notificações, comunidade, gamificação, chat e recomendações
    de IA). Dados financeiros (saldos, transações, investimentos, ativos, contas, cartões e faturas) são consultados
    sob demanda no provedor de Open Finance, normalizados e devolvidos — NÃO existe espelhamento local. Os endpoints
    do grupo "Dados Financeiros" são somente leitura. Convenções: IDs são inteiros (INT); colunas id_* do banco
    aparecem como *_id; campos TINYINT de status/visibilidade são expostos como enums de texto.'
  version: 3.0.0
  contact:
    name: Equipe FIMAP
servers:
- url: https://api.fimap.app/api/v1
  description: Produção (exemplo)
- url: https://staging-api.fimap.app/api/v1
  description: Homologação (exemplo)
tags:
- name: Autenticação
  description: Cadastro, login, tokens, dispositivos (tbl_dispositivo) e recuperação de senha (tbl_codigo_otp)
- name: Perfil
  description: Perfil privado e perfil social (tbl_usuario)
- name: Seguidores
  description: Relações de seguir (tbl_seguidores)
- name: Configurações
  description: Preferências de notificação e conteúdo (tbl_configuracoes)
- name: Open Finance
  description: Metadados de conexão/consentimento (tbl_conexao_open_finance)
- name: Dados Financeiros
  description: Consulta ao provedor de Open Finance. Somente leitura, sem persistência local.
- name: Metas
  description: Metas financeiras (tbl_meta_financeira, tbl_categoria_meta)
- name: Simulações
  description: Simulações de investimento e de amortização
- name: Notificações
  description: Notificações do aplicativo (tbl_notificacao)
- name: Comunidade
  description: Posts, comentários, curtidas e denúncias
- name: Gamificação
  description: Badges, XP e ranking
- name: IA
  description: Chat com o assistente financeiro e recomendações geradas (tbl_chat, tbl_mensagem, tbl_recomendacao_ia).
    A IA é apenas informativa e não executa operações financeiras.
security:
- autenticacaoBearer: []
paths:
  /autenticacao/cadastro:
    post:
      operationId: cadastrarUsuario
      tags:
      - Autenticação
      summary: Cadastrar novo usuário
      description: Cria o registro em tbl_usuario. A senha é armazenada somente como hash.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequisicaoCadastro'
      responses:
        '201':
          description: Usuário criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '409':
          description: E-mail, CPF ou username já cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '422':
          description: Dados inválidos ou senha fora da política
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /autenticacao/entrar:
    post:
      operationId: entrar
      tags:
      - Autenticação
      summary: Autenticar usuário (access + refresh token)
      description: Quando `dispositivo` é informado, o dispositivo é registrado (ou atualizado) em tbl_dispositivo.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequisicaoLogin'
      responses:
        '200':
          description: Login efetuado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaLogin'
        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /autenticacao/renovar-token:
    post:
      operationId: renovarToken
      tags:
      - Autenticação
      summary: Renovar access token a partir do refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token_renovacao
              properties:
                token_renovacao:
                  type: string
      responses:
        '200':
          description: Novo par de tokens emitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokensAutenticacao'
        '401':
          description: Refresh token inválido, expirado ou revogado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /autenticacao/sair:
    post:
      operationId: sair
      tags:
      - Autenticação
      summary: Encerrar a sessão atual (revoga o refresh token corrente)
      responses:
        '204':
          description: Sessão encerrada
        '401':
          $ref: '#/components/responses/NaoAutenticado'
  /autenticacao/sair-de-todos:
    post:
      operationId: sairDeTodos
      tags:
      - Autenticação
      summary: Encerrar todas as sessões do usuário
      responses:
        '204':
          description: Todas as sessões revogadas
        '401':
          $ref: '#/components/responses/NaoAutenticado'
  /autenticacao/dispositivos:
    get:
      operationId: listarDispositivos
      tags:
      - Autenticação
      summary: Listar dispositivos cadastrados do usuário (tbl_dispositivo)
      responses:
        '200':
          description: Lista de dispositivos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dispositivo'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
  /autenticacao/dispositivos/{dispositivoId}:
    parameters:
    - $ref: '#/components/parameters/DispositivoId'
    delete:
      operationId: removerDispositivo
      tags:
      - Autenticação
      summary: Remover um dispositivo (revoga as sessões dele)
      responses:
        '204':
          description: Dispositivo removido
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          description: Dispositivo não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /autenticacao/senha/alterar:
    post:
      operationId: alterarSenha
      tags:
      - Autenticação
      summary: Alterar senha do usuário autenticado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - senha_atual
              - nova_senha
              properties:
                senha_atual:
                  type: string
                  format: password
                nova_senha:
                  type: string
                  format: password
      responses:
        '200':
          description: Senha alterada com sucesso
        '400':
          description: Senha atual incorreta ou nova senha fora da política
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
  /autenticacao/senha/recuperacao/solicitar:
    post:
      operationId: solicitarRecuperacaoSenha
      tags:
      - Autenticação
      summary: Solicitar recuperação de senha (gera código OTP)
      description: Gera um registro em tbl_codigo_otp (código de 6 dígitos, `ativo`, `data_expiracao`) e envia ao
        e-mail do usuário. Responde 202 mesmo se o e-mail não existir.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  maxLength: 255
                  format: email
      responses:
        '202':
          description: Processo de recuperação iniciado
  /autenticacao/senha/recuperacao/validar-codigo:
    post:
      operationId: validarCodigoRecuperacao
      tags:
      - Autenticação
      summary: Validar código OTP de recuperação
      description: Valida contra tbl_codigo_otp (`codigo`, `ativo`, `data_expiracao`) e o inativa. O `token_redefinicao`
        é um token assinado de curta duração (não há tabela própria no modelo).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - codigo
              properties:
                email:
                  type: string
                  maxLength: 255
                  format: email
                codigo:
                  type: string
                  maxLength: 6
                  minLength: 6
      responses:
        '200':
          description: Código válido — devolve token de redefinição
          content:
            application/json:
              schema:
                type: object
                properties:
                  token_redefinicao:
                    type: string
        '400':
          description: Código expirado, incorreto ou já utilizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /autenticacao/senha/recuperacao/redefinir:
    post:
      operationId: redefinirSenha
      tags:
      - Autenticação
      summary: Definir nova senha ao final do fluxo de recuperação
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token_redefinicao
              - nova_senha
              properties:
                token_redefinicao:
                  type: string
                nova_senha:
                  type: string
                  format: password
      responses:
        '200':
          description: Senha redefinida com sucesso
        '400':
          description: Token inválido/expirado ou senha fora da política
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /usuarios/eu:
    get:
      operationId: consultarPerfil
      tags:
      - Perfil
      summary: Consultar perfil do usuário autenticado
      responses:
        '200':
          description: Dados do perfil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
    patch:
      operationId: editarPerfil
      tags:
      - Perfil
      summary: Editar dados do perfil
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntradaPerfil'
      responses:
        '200':
          description: Perfil atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '409':
          description: Username ou username social já em uso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '422':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /usuarios/{usuarioId}:
    parameters:
    - $ref: '#/components/parameters/UsuarioId'
    get:
      operationId: consultarPerfilPublico
      tags:
      - Perfil
      summary: Consultar perfil social de outro usuário
      description: Retorna somente campos sociais. Se o usuário tiver `visibilidade` = privado, o Back-end limita
        os campos retornados.
      responses:
        '200':
          description: Perfil social
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilPublico'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          description: Usuário não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /usuarios/{usuarioId}/seguir:
    parameters:
    - $ref: '#/components/parameters/UsuarioId'
    post:
      operationId: seguirUsuario
      tags:
      - Seguidores
      summary: Seguir um usuário (tbl_seguidores)
      responses:
        '204':
          description: Agora segue o usuário
        '400':
          description: Não é possível seguir a si mesmo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          description: Usuário não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '409':
          description: Já segue este usuário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
    delete:
      operationId: deixarDeSeguirUsuario
      tags:
      - Seguidores
      summary: Deixar de seguir um usuário
      responses:
        '204':
          description: Deixou de seguir
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          description: Usuário não encontrado ou não seguido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /usuarios/{usuarioId}/seguidores:
    parameters:
    - $ref: '#/components/parameters/UsuarioId'
    get:
      operationId: listarSeguidores
      tags:
      - Seguidores
      summary: Listar seguidores de um usuário
      parameters:
      - $ref: '#/components/parameters/Pagina'
      - $ref: '#/components/parameters/TamanhoPagina'
      responses:
        '200':
          description: Lista de seguidores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UsuarioResumo'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          description: Usuário não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /usuarios/{usuarioId}/seguindo:
    parameters:
    - $ref: '#/components/parameters/UsuarioId'
    get:
      operationId: listarSeguindo
      tags:
      - Seguidores
      summary: Listar quem o usuário segue
      parameters:
      - $ref: '#/components/parameters/Pagina'
      - $ref: '#/components/parameters/TamanhoPagina'
      responses:
        '200':
          description: Lista de usuários seguidos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UsuarioResumo'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          description: Usuário não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /configuracoes:
    get:
      operationId: consultarConfiguracoes
      tags:
      - Configurações
      summary: Consultar configurações do usuário (tbl_configuracoes)
      responses:
        '200':
          description: Configurações atuais
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configuracoes'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
    put:
      operationId: atualizarConfiguracoes
      tags:
      - Configurações
      summary: Atualizar configurações (notificações, alertas, relatórios, recomendações, tópicos)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Configuracoes'
      responses:
        '200':
          description: Configurações atualizadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configuracoes'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '422':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /open-finance/conexoes:
    get:
      operationId: listarConexoesOpenFinance
      tags:
      - Open Finance
      summary: Listar conexões Open Finance do usuário (tbl_conexao_open_finance)
      description: Retorna apenas metadados técnicos da conexão — nunca saldo, transações ou posições.
      responses:
        '200':
          description: Lista de conexões
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConexaoOpenFinance'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
    post:
      operationId: criarConexaoOpenFinance
      tags:
      - Open Finance
      summary: Iniciar uma nova conexão/consentimento com uma instituição
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntradaConexaoOpenFinance'
      responses:
        '201':
          description: Conexão criada em estado pendente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConexaoOpenFinance'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '422':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '502':
          description: Falha ao iniciar consentimento no provedor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /open-finance/conexoes/{conexaoId}:
    parameters:
    - $ref: '#/components/parameters/ConexaoId'
    get:
      operationId: consultarConexaoOpenFinance
      tags:
      - Open Finance
      summary: Consultar metadados de uma conexão
      responses:
        '200':
          description: Detalhe da conexão
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConexaoOpenFinance'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          description: Conexão não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
    delete:
      operationId: revogarConexaoOpenFinance
      tags:
      - Open Finance
      summary: Revogar uma conexão (revoga o consentimento no provedor)
      responses:
        '204':
          description: Conexão revogada
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          description: Conexão não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /financeiro/resumo:
    get:
      operationId: consultarResumoFinanceiro
      tags:
      - Dados Financeiros
      summary: Consultar resumo financeiro consolidado
      description: Agregado calculado em tempo real a partir do provedor. Nada é persistido.
      parameters:
      - $ref: '#/components/parameters/ConexaoIdQuery'
      responses:
        '200':
          description: Dado externo consultado sob demanda
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumoFinanceiro'
        '400':
          description: Parâmetros inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '502':
          description: Falha ao consultar o provedor de Open Finance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /financeiro/contas:
    get:
      operationId: listarContasFinanceiras
      tags:
      - Dados Financeiros
      summary: Consultar contas bancárias externas
      description: Obtido sob demanda no provedor. Sem tabela local.
      parameters:
      - $ref: '#/components/parameters/ConexaoIdQuery'
      responses:
        '200':
          description: Dado externo consultado sob demanda
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContaFinanceira'
        '400':
          description: Parâmetros inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '502':
          description: Falha ao consultar o provedor de Open Finance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /financeiro/transacoes:
    get:
      operationId: listarTransacoesFinanceiras
      tags:
      - Dados Financeiros
      summary: Consultar transações do provedor
      description: Somente leitura. Não existem POST/PUT/DELETE — não há tabela de transações no FIMAP.
      parameters:
      - $ref: '#/components/parameters/ConexaoIdQuery'
      - name: data_inicio
        in: query
        schema:
          type: string
          format: date
      - name: data_fim
        in: query
        schema:
          type: string
          format: date
      - $ref: '#/components/parameters/Pagina'
      - $ref: '#/components/parameters/TamanhoPagina'
      responses:
        '200':
          description: Dado externo consultado sob demanda
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransacaoFinanceira'
        '400':
          description: Parâmetros inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '502':
          description: Falha ao consultar o provedor de Open Finance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /financeiro/investimentos:
    get:
      operationId: listarInvestimentosFinanceiros
      tags:
      - Dados Financeiros
      summary: Consultar investimentos do provedor
      description: Somente leitura. Sem tabela local.
      parameters:
      - $ref: '#/components/parameters/ConexaoIdQuery'
      responses:
        '200':
          description: Dado externo consultado sob demanda
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvestimentoFinanceiro'
        '400':
          description: Parâmetros inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '502':
          description: Falha ao consultar o provedor de Open Finance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /financeiro/ativos:
    get:
      operationId: listarAtivosFinanceiros
      tags:
      - Dados Financeiros
      summary: Consultar catálogo de ativos dos investimentos externos
      description: Somente leitura. Sem tabela local.
      responses:
        '200':
          description: Dado externo consultado sob demanda
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AtivoFinanceiro'
        '400':
          description: Parâmetros inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '502':
          description: Falha ao consultar o provedor de Open Finance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /financeiro/cartoes:
    get:
      operationId: listarCartoesFinanceiros
      tags:
      - Dados Financeiros
      summary: Consultar cartões do provedor
      description: Somente leitura. Sem tabela local de cartões.
      parameters:
      - $ref: '#/components/parameters/ConexaoIdQuery'
      responses:
        '200':
          description: Dado externo consultado sob demanda
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CartaoFinanceiro'
        '400':
          description: Parâmetros inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '502':
          description: Falha ao consultar o provedor de Open Finance
          content:
